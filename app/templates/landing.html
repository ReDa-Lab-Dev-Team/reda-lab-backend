<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDA Lab - Research and Data Analytics Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: white;
            overflow-x: hidden;
        }

        /* Animated background */
        .background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: linear-gradient(135deg, #0a0e27 0%, #003d6b 50%, #0066b3 100%);
        }

        .background::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,165,0,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(0, 102, 179, 0.5);
            border-radius: 50%;
            z-index: 1;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        /* Logo section - fixed top left */
        .logo-section {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            animation: fadeInDown 1s ease-out;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 102, 179, 0.4);
            transition: all 0.3s ease;
            background: white;
            padding: 8px;
            cursor: pointer;
        }

        .logo:hover {
            transform: scale(1.1);
            border-color: rgba(255, 165, 0, 0.5);
            box-shadow: 0 15px 40px rgba(0, 102, 179, 0.6);
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Welcome section */
        .welcome-section {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        /* Welcome content */
        .welcome-content {
            text-align: center;
        }

        .welcome-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.3);
            border-radius: 50px;
            color: #ffa500;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #0066b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
        }

        /* CTA Buttons */
        .cta-section {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn {
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0066b3 0%, #003d6b 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(0, 102, 179, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 102, 179, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 165, 0, 0.5);
            transform: translateY(-3px);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-section {
                top: 1.5rem;
                left: 1.5rem;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            h1 {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .cta-section {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 300px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="background"></div>

    <!-- Floating particles -->
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 3s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 6s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 9s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 12s;"></div>

    <!-- Logo - Fixed Top Left -->
    <div class="logo-section">
        <img src="/public/ReDA.jpg" alt="REDA Lab Logo" class="logo" onerror="this.style.display='none'">
    </div>

    <!-- Main content -->
    <div class="container">
        <!-- Welcome section -->
        <div class="welcome-section">
            <div class="welcome-content">
                <div class="welcome-badge"> Welcome to ReDA Lab API</div>
                <h1>Research & Data<br>Analytics Lab</h1>
                <p class="subtitle">Empowering Innovation Through Data</p>
            </div>
        </div>

        <!-- CTA buttons -->
        <div class="cta-section">
            <a href="/docs" class="btn btn-primary">
                 API Documentation
            </a>
            <a href="/redoc" class="btn btn-secondary">
                 ReDoc
            </a>
        </div>
    </div>
</body>
</html>
